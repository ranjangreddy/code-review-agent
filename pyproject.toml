[project]
name = "code-review-agent"
version = "0.1.0"
description = "Multi-agent AI code reviewer built with LangGraph: a planner, parallel security/bug/performance specialists, and a lead reviewer. Works with any LangChain chat model."
readme = "README.md"
authors = [
    { name = "ranjangreddy", email = "ranjan.g.reddy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
code-review = "code_review_agent.cli:main"

[project.optional-dependencies]
openai = [
    "langchain-openai>=1.6.6",
]
google = [
    "langchain-google-genai>=4.4.0",
]
ollama = [
    "langchain-ollama>=1.1.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
